        <script>

                const calendarBtn =

                function isValidDDMMYYYY(dateStr) {

                        if (!/^\d{8}$/.test(dateStr)) {
                                return false;
                        }

                        const dd = parseInt(dateStr.substring(0, 2), 10);
                        const mm = parseInt(dateStr.substring(2, 4), 10);
                        const yyyy = parseInt(dateStr.substring(4, 8), 10);

                        const date = new Date(yyyy, mm - 1, dd);

                        return (
                                date.getFullYear() === yyyy &&
                                date.getMonth() === mm - 1 &&
                                date.getDate() === dd
                        );
                }


                let conversionMode = "localToUtc";

                function setLocalToUtc() {
                        conversionMode = "localToUtc";

                        document.getElementById("conversionResult")
                                .textContent = "Awaiting input...";
                }

                function setUtcToLocal() {
                        conversionMode = "utcToLocal";

                        document.getElementById("conversionResult")
                                .textContent = "Awaiting input...";
                }

                function toggleConversionMode() {

                        if (conversionMode === "localToUtc") {

                                conversionMode = "utcToLocal";

                                document.getElementById("conversionLabel")
                                        .textContent = "UTC → Local";

                        } else {

                                conversionMode = "localToUtc";

                                document.getElementById("conversionLabel")
                                        .textContent = "Local → UTC";
                        }

                        document.getElementById("conversionResult")
                                .textContent = "";
                }

                function crc16Xmodem(str) {
                        let crc = 0x0000;

                        for (let i = 0; i < str.length; i++) {
                                crc ^= (str.charCodeAt(i) << 8);

                                for (let j = 0; j < 8; j++) {
                                        if (crc & 0x8000) {
                                                crc = ((crc << 1) ^ 0x1021) & 0xFFFF;
                                        } else {
                                                crc = (crc << 1) & 0xFFFF;
                                        }
                                }
                        }

                        return crc;
                }

                function calculateLuhnDigit(numberStr) {
                        let sum = 0;
                        let shouldDouble = true;

                        for (let i = numberStr.length - 1; i >= 0; i--) {
                                let digit = parseInt(numberStr[i], 10);

                                if (shouldDouble) {
                                        digit *= 2;
                                        if (digit > 9) digit -= 9;
                                }

                                sum += digit;
                                shouldDouble = !shouldDouble;
                        }

                        return (10 - (sum % 10)) % 10;
                }

                /*

                        /*                         document.getElementById("manualDate").style.display =

                        if (mode === "manual") {

                        */

                                result.textContent = "------";

                        }
                }

                function getDatePart() {

                        const mode =
                                document.querySelector(
                                        'input[name="dateMode"]:checked'
                                ).value;

                        let date;

                        if (mode === "utc") {

                                date = new Date();

                                return (
                                        String(date.getUTCDate()).padStart(2, "0") +
                                        String(date.getUTCMonth() + 1).padStart(2, "0") +
                                        date.getUTCFullYear()
                                );
                        }

                        const manualValue =
                                document.getElementById("manualDate").value;

                        if (!manualValue) {

                                alert("Please select a date.");

                                return null;
                        }

                        date = new Date(manualValue);

                        return (
                                String(date.getDate()).padStart(2, "0") +
                                String(date.getMonth() + 1).padStart(2, "0") +
                                date.getFullYear()
                        );
                }


                function calculate() {
                        /*
                         const input =
                                document.getElementById("input").value.trim();
                        */

                        const datePart = getDatePart();

                        if (!datePart) {
                                return;
                        }

                        const suffix =
                                document.getElementById("suffixInput")
                                        .value.trim()
                                        .toUpperCase();

                        if (suffix.length !== 8) {

                                alert("Suffix must be exactly 8 characters.");

                                return;
                        }

                        const input = datePart + suffix;

                        // Must be at least 8 chars for DDMMYYYY
                        /*
                        if (input.length < 8) {
                
                                alert("Input must start with DDMMYYYY.");
                
                                return;
                        }
                
                        const datePart = input.substring(0, 8);
                
                        if (!isValidDDMMYYYY(datePart)) {
                
                                alert(
                                        "Invalid date. Expected valid DDMMYYYY format.\n" +
                                        "Example: 01012026MAXT0000"
                                );
                                document.getElementById("finalResult")
                                .textContent = 'XXXXXX';
                                return;
                        }
                        */
                        const crc = crc16Xmodem(input);

                        const crcHex =
                                crc.toString(16).toUpperCase().padStart(4, "0");

                        const crcDec = crc.toString();

                        const luhnDigit =
                                calculateLuhnDigit(crcDec);

                        const finalResult =
                                (crcDec + luhnDigit).padEnd(6, "0");

                        /*
                        document.getElementById("finalResult")
                                .textContent = finalResult;
                                */

                        const result = document.getElementById("finalResult");

                        result.textContent = finalResult;
                        result.classList.remove("placeholder");
                }

                function formatDateTime(date) {
                        const dd = String(date.getDate()).padStart(2, "0");
                        const mm = String(date.getMonth() + 1).padStart(2, "0");
                        const yyyy = date.getFullYear();

                        const hh = String(date.getHours()).padStart(2, "0");
                        const min = String(date.getMinutes()).padStart(2, "0");
                        const ss = String(date.getSeconds()).padStart(2, "0");

                        return `${dd}/${mm}/${yyyy}, ${hh}:${min}:${ss}`;
                }

                function updateDateTime() {
                        const now = new Date();

                        const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;

                        const offsetMinutes = -now.getTimezoneOffset();
                        const sign = offsetMinutes >= 0 ? "+" : "-";
                        const hours = String(Math.floor(Math.abs(offsetMinutes) / 60)).padStart(2, "0");
                        const minutes = String(Math.abs(offsetMinutes) % 60).padStart(2, "0");

                        const gmtOffset = `GMT${sign}${hours}:${minutes}`;

                        // Local time
                        const localDateTime = formatDateTime(now);

                        // UTC time in same format
                        const utcDateTime =
                                `${String(now.getUTCDate()).padStart(2, "0")}/` +
                                `${String(now.getUTCMonth() + 1).padStart(2, "0")}/` +
                                `${now.getUTCFullYear()}, ` +
                                `${String(now.getUTCHours()).padStart(2, "0")}:` +
                                `${String(now.getUTCMinutes()).padStart(2, "0")}:` +
                                `${String(now.getUTCSeconds()).padStart(2, "0")}`;

                        document.getElementById("timeZone").textContent =
                                `${timezone} (${gmtOffset})`;

                        document.getElementById("localDateTime").textContent =
                                localDateTime;

                        document.getElementById("utcDateTime").textContent =
                                `${utcDateTime} UTC`;
                }

                function formatDateTime(date) {
                        const dd = String(date.getDate()).padStart(2, "0");
                        const mm = String(date.getMonth() + 1).padStart(2, "0");
                        const yyyy = date.getFullYear();

                        const hh = String(date.getHours()).padStart(2, "0");
                        const min = String(date.getMinutes()).padStart(2, "0");
                        const ss = String(date.getSeconds()).padStart(2, "0");

                        return `${dd}/${mm}/${yyyy}, ${hh}:${min}:${ss}`;
                }

                function formatUTC(date) {
                        const dd = String(date.getUTCDate()).padStart(2, "0");
                        const mm = String(date.getUTCMonth() + 1).padStart(2, "0");
                        const yyyy = date.getUTCFullYear();

                        const hh = String(date.getUTCHours()).padStart(2, "0");
                        const min = String(date.getUTCMinutes()).padStart(2, "0");
                        const ss = String(date.getUTCSeconds()).padStart(2, "0");

                        return `${dd}/${mm}/${yyyy}, ${hh}:${min}:${ss}`;
                }

                function updateTimezoneInfo() {

                        const now = new Date();

                        const timezone =
                                Intl.DateTimeFormat().resolvedOptions().timeZone;

                        const offsetMinutes = -now.getTimezoneOffset();

                        const sign = offsetMinutes >= 0 ? "+" : "-";

                        const hours =
                                String(Math.floor(Math.abs(offsetMinutes) / 60))
                                        .padStart(2, "0");

                        const minutes =
                                String(Math.abs(offsetMinutes) % 60)
                                        .padStart(2, "0");

                        const text =
                                `${timezone} (GMT${sign}${hours}:${minutes})`;

                        document.getElementById("timeZone").textContent = text;
                        document.getElementById("timeZoneConverter").textContent = text;
                }

                function convertLocalToUtc() {

                        const value =
                                document.getElementById("localInput").value;

                        if (!value) return;

                        const localDate = new Date(value);

                        document.getElementById("localToUtcResult").textContent =
                                formatUTC(localDate) + " UTC";
                }

                function convertUtcToLocal() {

                        const value =
                                document.getElementById("utcInput").value;

                        if (!value) return;

                        const utcDate = new Date(value + "Z");

                        document.getElementById("utcToLocalResult").textContent =
                                formatDateTime(utcDate);
                }

                function convertDateTime() {

                        const value =
                                document.getElementById("dateInput").value;

                        if (!value) {
                                alert("Please select a date/time.");
                                return;
                        }

                        let result = "";

                        if (conversionMode === "utcToLocal") {

                                const utcDate = new Date(value + "Z");

                                const timezone =
                                        Intl.DateTimeFormat().resolvedOptions().timeZone;

                                const offsetMinutes = -utcDate.getTimezoneOffset();

                                const sign = offsetMinutes >= 0 ? "+" : "-";

                                const hours =
                                        String(Math.floor(Math.abs(offsetMinutes) / 60))
                                                .padStart(2, "0");

                                const minutes =
                                        String(Math.abs(offsetMinutes) % 60)
                                                .padStart(2, "0");

                                result =
                                        `${formatDateTime(utcDate)} ` +
                                        `${timezone} (GMT${sign}${hours}:${minutes})`;
                        }

                        if (conversionMode === "localToUtc") {

                                const localDate = new Date(value);

                                const timezone =
                                        Intl.DateTimeFormat().resolvedOptions().timeZone;

                                result =
                                        `${formatUTC(localDate)} UTC`;
                        }

                        document.getElementById("conversionResult")
                                .textContent = result;
                }

                updateTimezoneInfo();


                updateDateTime();
                setInterval(updateDateTime, 1000);


                calculate();
        </script>

</body>
