<!DOCTYPE html>
<html lang="en">

<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ingenico Log Analyzer</title>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
                rel="stylesheet">

        <style>
                :root {
                        --bg: #070b14;
                        --panel: #0d1321;
                        --panel2: #121a2c;

                        --accent: #00d4ff;
                        --success: #28ff88;
                        --warning: #ffb020;
                        --danger: #ff5f56;

                        --text: #e8eef9;
                        --muted: #7d8ca5;
                        --border: rgba(0, 212, 255, .14);

                        --request: #00d4ff;
                        --response: #28ff88;
                        --event: #ffb020;
                }

                * {
                        margin: 0;
                        padding: 0;
                        box-sizing: border-box;
                }

                html,
                body {
                        height: 100%;
                        background: #070b14;
                        color: var(--text);
                        font-family: 'JetBrains Mono', monospace;
                        background-image:
                                linear-gradient(rgba(0, 212, 255, .04) 1px, transparent 1px),
                                linear-gradient(90deg, rgba(0, 212, 255, .04) 1px, transparent 1px);
                        background-size: 40px 40px;
                }

                .header {
                        height: 80px;
                        display: flex;
                        align-items: center;
                        justify-content: space-between;
                        padding: 0 30px;
                        border-bottom: 1px solid var(--border);
                        background: rgba(7, 11, 20, .85);
                        backdrop-filter: blur(10px);
                }

                .brand h1 {
                        color: var(--accent);
                        font-size: 28px;
                        letter-spacing: 3px;
                }

                .brand p {
                        color: var(--muted);
                        font-size: 12px;
                }

                .header-right {
                        text-align: right;
                }

                .header-right .status {
                        color: var(--success);
                        font-size: 12px;
                        letter-spacing: 2px;
                        font-weight: 700;
                        display: none;
                }

                .header-right p {
                        color: var(--muted);
                        font-size: 12px;
                        margin-top: 0;
                }

                .container {
                        max-width: 1700px;
                        margin: auto;
                        padding: 25px;
                }

                textarea {
                        width: 100%;
                        min-height: 260px;
                        background: rgba(7, 11, 20, .9);
                        color: var(--text);
                        border: 1px solid var(--border);
                        padding: 18px;
                        resize: vertical;
                        border-radius: 0;
                        font-family: 'JetBrains Mono', monospace;
                        font-size: 13px;
                        line-height: 1.6;
                        box-shadow: inset 0 0 18px rgba(0, 212, 255, .04);
                }

                textarea:focus {
                        outline: 1px solid var(--accent);
                        border-color: var(--accent);
                }

                .toolbar {
                        display: flex;
                        gap: 10px;
                        flex-wrap: wrap;
                        margin: 20px 0;
                }

                button {
                        background: transparent;
                        color: var(--accent);
                        border: 1px solid var(--accent);
                        font-family: inherit;
                        padding: 10px 14px;
                        cursor: pointer;
                        transition: .25s;
                }

                button:hover {
                        background: rgba(0, 212, 255, .08);
                        box-shadow: 0 0 12px rgba(0, 212, 255, .15);
                }

                .search-box {
                        flex: 1;
                        min-width: 250px;
                        background: rgba(7, 11, 20, .9);
                        color: var(--text);
                        border: 1px solid var(--border);
                        padding: 10px 14px;
                        font-family: inherit;
                }

                .stats {
                        display: grid;
                        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
                        gap: 15px;
                        margin-bottom: 25px;
                }

                .stat-card,
                .invalid-summary-card {
                        background: var(--panel);
                        border: 1px solid var(--border);
                        padding: 18px;
                        position: relative;
                        min-height: 110px;
                }

                .stat-card::before {
                        content: '';
                        position: absolute;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 2px;
                        background: var(--accent);
                }

                .invalid-summary-card::before {
                        content: '';
                        position: absolute;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 2px;
                        background: var(--danger);
                }

                .stat-number {
                        font-size: 40px;
                        line-height: 1;
                        font-weight: 500;
                        letter-spacing: 1px;
                }

                .stat-label {
                        color: var(--muted);
                        font-size: 14px;
                        margin-top: 12px;
                }

                .json-block {
                        margin-bottom: 16px;
                }

                details {
                        background: var(--panel);
                        border: 1px solid var(--border);
                        overflow: hidden;
                        position: relative;
                }

                details::before {
                        content: '';
                        position: absolute;
                        left: 0;
                        top: 0;
                        bottom: 0;
                        width: 3px;
                        background: var(--accent);
                }

                .valid details::before {
                        background: var(--accent);
                }

                .invalid details::before {
                        background: var(--danger);
                }

                summary {
                        list-style: none;
                        cursor: pointer;
                        padding: 16px;
                        display: flex;
                        align-items: center;
                        justify-content: space-between;
                        gap: 10px;
                }

                summary::-webkit-details-marker {
                        display: none;
                }

                .summary-left {
                        display: flex;
                        align-items: center;
                        gap: 10px;
                        flex-wrap: wrap;
                }

                .badge {
                        padding: 6px 10px;
                        font-size: 10px;
                        border: 1px solid transparent;
                        letter-spacing: 1px;
                        text-transform: uppercase;
                }

                .summary-left span:last-child {
                        font-size: 14px;
                }

                .request-badge {
                        color: var(--request);
                        background: rgba(0, 212, 255, .08);
                        border-color: rgba(0, 212, 255, .25);
                }

                .response-badge {
                        color: var(--response);
                        background: rgba(40, 255, 136, .08);
                        border-color: rgba(40, 255, 136, .25);
                }

                .event-badge {
                        color: var(--event);
                        background: rgba(255, 176, 32, .08);
                        border-color: rgba(255, 176, 32, .25);
                }

                .copy-btn {
                        background: transparent;
                        color: var(--accent);
                        border: 1px solid var(--accent);
                        padding: 8px 12px;
                        font-size: 11px;
                        position: absolute;
                        top: 10px;
                        right: 15px;
                        z-index: 10;
                }

                pre {
                        margin: 0;
                        padding: 20px;
                        background: rgba(7, 11, 20, .9);
                        color: #dfe7f4;
                        overflow: auto;
                        max-height: 700px;
                        white-space: pre-wrap;
                        word-break: break-word;
                        font-size: 13px;
                        line-height: 1.6;
                }

                .invalid-summary-card {
                        padding: 18px 18px 18px 28px;
                        display: flex;
                        align-items: center;
                        justify-content: space-between;
                }

                .invalid-summary-header {
                        display: flex;
                        justify-content: space-between;
                        align-items: center;
                        gap: 18px;
                        width: 100%;
                }

                .invalid-summary-left {
                        display: flex;
                        flex-direction: column;
                        align-items: flex-start;
                        justify-content: center;
                        min-width: 0;
                        gap: 10px;
                }

                .invalid-summary-total {
                        font-size: 40px;
                        font-weight: 500;
                        line-height: 1;
                        letter-spacing: 1px;
                        color: var(--danger);
                }

                .invalid-summary-title {
                        color: var(--danger);
                        font-size: 14px;
                        line-height: 1.2;
                        white-space: nowrap;
                }

                .invalid-summary-detail {
                        display: flex;
                        flex-direction: column;
                        align-items: flex-end;
                        gap: 4px;
                        text-align: right;
                        font-size: 14px;
                }

                .invalid-summary-detail span {
                        white-space: nowrap;
                }

                .invalid-req { color: var(--request); }
                .invalid-res { color: var(--response); }
                .invalid-event { color: var(--event); }

                .toast {
                        position: fixed;
                        bottom: 20px;
                        right: 20px;
                        background: rgba(40, 255, 136, .12);
                        color: var(--success);
                        border: 1px solid rgba(40, 255, 136, .25);
                        padding: 12px 18px;
                        opacity: 0;
                        transform: translateY(20px);
                        transition: .3s;
                        pointer-events: none;
                        z-index: 9999;
                }

                .toast.show {
                        opacity: 1;
                        transform: translateY(0);
                }
        </style>
</head>

<body>

        <div class="header">
                <div class="brand">
                        <h1>AXL LOG ANALYZER</h1>
                        <p>Parse request, response and event payloads from Ingenico logs</p>
                </div>

                <div class="header-right">
                        <div class="status">ONLINE</div>
                        <p>Version 1.0 © 2026 hji</p>
                </div>
        </div>

        <div class="container">

                <textarea id="input" placeholder="Paste logs here..."></textarea>

                <div class="toolbar">

                        <button class="primary" onclick="parseLogs()">
                                Parse Logs
                        </button>

                        <button class="secondary" onclick="expandAll()">
                                Expand All
                        </button>

                        <button class="secondary" onclick="collapseAll()">
                                Collapse All
                        </button>

                        <input id="searchInput" class="search-box" placeholder="Search..." onkeyup="filterResults()">
                </div>

                <div id="results"></div>

        </div>

        <script>

                function countBraces(text) {

                        let count = 0;
                        let inString = false;
                        let escape = false;

                        for (const ch of text) {

                                if (escape) {
                                        escape = false;
                                        continue;
                                }

                                if (ch === "\\") {
                                        escape = true;
                                        continue;
                                }

                                if (ch === '"') {
                                        inString = !inString;
                                        continue;
                                }

                                if (!inString) {
                                        if (ch === '{') count++;
                                        if (ch === '}') count--;
                                }
                        }

                        return count;
                }

                function extractJsonObjects(logText) {

                        const results = [];
                        const lines = logText.split(/\r?\n/);

                        let buffer = "";
                        let active = false;
                        let braceCount = 0;

                        for (const line of lines) {

                                const match =
                                        line.match(/IngenicoAxL:(request|response):\s*(\{.*)?$/);

                                if (match) {

                                        if (active && buffer.trim()) {
                                                results.push(buffer);
                                        }

                                        buffer = match[2] || "";

                                        braceCount = countBraces(buffer);

                                        active = braceCount > 0;

                                        if (braceCount === 0 && buffer.trim()) {

                                                results.push(buffer);
                                                buffer = "";
                                                active = false;
                                        }

                                        continue;
                                }

                                if (active) {

                                        buffer += "\n" + line;
                                        braceCount += countBraces(line);

                                        if (braceCount === 0) {

                                                results.push(buffer);
                                                buffer = "";
                                                active = false;
                                        }
                                }
                        }

                        if (buffer.trim()) {
                                results.push(buffer);
                        }

                        return results;
                }

                function escapeHtml(str) {

                        return str
                                .replaceAll("&", "&amp;")
                                .replaceAll("<", "&lt;")
                                .replaceAll(">", "&gt;");
                }

                function stripTypePrefix(title) {
                        return title
                                .replace(/^REQUEST\s*-\s*/, "")
                                .replace(/^RESPONSE\s*-\s*/, "")
                                .replace(/^EVENT\s*-\s*/, "");
                }

                function getScreenTextSummary(screenInfo) {
                        if (!screenInfo || typeof screenInfo !== 'object') {
                                return '';
                        }

                        const values = [];
                        const addValues = (value) => {
                                if (Array.isArray(value)) {
                                        value.forEach(item => {
                                                if (typeof item === 'string' && item.trim()) {
                                                        values.push(item.trim());
                                                }
                                        });
                                } else if (typeof value === 'string' && value.trim()) {
                                        values.push(value.trim());
                                }
                        };

                        const textSource =
                                screenInfo.text && (Array.isArray(screenInfo.text) ? screenInfo.text.length : screenInfo.text.length > 0)
                                        ? screenInfo.text
                                        : screenInfo.primary_text;

                        addValues(textSource);

                        return values.length ? values.join(' ') : '';
                }

                function getTitle(obj) {

                        if (obj.request) {
                                const resource = obj.request.resource || {};

                                return `REQUEST - ${resource.type ||
                                        resource.txn_type ||
                                        "UNKNOWN"
                                        }`;
                        }

                        if (obj.response) {
                                const resource = obj.response.resource || {};

                                return `RESPONSE - ${resource.type ||
                                        resource.txn_type ||
                                        "UNKNOWN"
                                        }`;
                        }

                        if (obj.event) {

                                const resource = obj.event.resource || {};

                                const type =
                                        resource.type ||
                                        resource.txn_type;

                                const eventType =
                                        resource.event_type;

                                const screenName =
                                        resource.screen_info?.name;

                                if (eventType === "print_status" && resource.receipt_owner) {
                                        return `EVENT - ${eventType} - ${resource.receipt_owner}`;
                                }

                                if (eventType === "screen_info") {
                                        const screenText = getScreenTextSummary(resource.screen_info);
                                        const label = screenName || 'screen_info';

                                        if (screenText) {
                                                return `EVENT - ${eventType} - ${label} - [${screenText}]`;
                                        }

                                        if (type) {
                                                return `EVENT - ${type} - ${eventType} - ${label}`;
                                        }

                                        return `EVENT - ${eventType} - ${label}`;
                                }

                                if (type && eventType) {
                                        return `EVENT - ${type} - ${eventType}`;
                                }

                                if (type) {
                                        return `EVENT - ${type}`;
                                }

                                if (eventType) {
                                        return `EVENT - ${eventType}`;
                                }

                                return "EVENT - UNKNOWN";
                        }

                        return "UNKNOWN";
                }

                function copyJson(index) {

                        const text =
                                document.getElementById(
                                        "json-" + index
                                ).innerText;

                        navigator.clipboard.writeText(text)
                                .then(() => {

                                        button.innerText = "✓ Copied!";
                                        button.style.background = "#16a34a";

                                        showToast("JSON copied to clipboard");

                                        setTimeout(() => {
                                                button.innerText = "Copy";
                                                button.style.background = "#334155";
                                        }, 1500);
                                });
                }

                function expandAll() {

                        document
                                .querySelectorAll("details")
                                .forEach(d => d.open = true);
                }

                function collapseAll() {

                        document
                                .querySelectorAll("details")
                                .forEach(d => d.open = false);
                }

                function filterResults() {

                        const term =
                                document
                                        .getElementById("searchInput")
                                        .value
                                        .toLowerCase();

                        document
                                .querySelectorAll(".json-block")
                                .forEach(card => {

                                        const text =
                                                card.innerText.toLowerCase();

                                        card.style.display =
                                                text.includes(term)
                                                        ? ""
                                                        : "none";
                                });
                }

                function parseLogs() {

                        const text =
                                document.getElementById("input").value;

                        const jsonBlocks =
                                extractJsonObjects(text);

                        const container =
                                document.getElementById("results");

                        let requestCount = 0;
                        let responseCount = 0;
                        let eventCount = 0;

                        let invalidTotal = 0;
                        let invalidRequest = 0;
                        let invalidResponse = 0;
                        let invalidEvent = 0;


                        jsonBlocks.forEach(raw => {

                                try {
                                        JSON.parse(raw);
                                } catch {

                                        invalidTotal++;

                                        if (raw.includes('"request"'))
                                                invalidRequest++;

                                        else if (raw.includes('"response"'))
                                                invalidResponse++;

                                        else if (raw.includes('"event"'))
                                                invalidEvent++;
                                }

                                if (raw.includes('"request"'))
                                        requestCount++;

                                else if (raw.includes('"response"'))
                                        responseCount++;

                                else if (raw.includes('"event"'))
                                        eventCount++;
                        });

                        const invalidSummary = `
<div class="invalid-summary-card">

  <div class="invalid-summary-header">

    <div class="invalid-summary-left">

        <div class="invalid-summary-total">
            ${invalidTotal}
        </div>

        <div class="invalid-summary-title">
            Invalid JSON
        </div>

    </div>

    <div class="invalid-summary-detail">

        <span class="invalid-req">
            Requests: ${invalidRequest}
        </span>

        <span class="invalid-res">
            Responses: ${invalidResponse}
        </span>

        <span class="invalid-event">
            Events: ${invalidEvent}
        </span>

    </div>

</div>

</div>
`;

                        container.innerHTML = `
    <div class="stats">

        <div class="stat-card">
            <div class="stat-number">${jsonBlocks.length}</div>
            <div class="stat-label">Total Payloads</div>
        </div>

        <div class="stat-card">
            <div class="stat-number">${requestCount}</div>
            <div class="stat-label">Requests</div>
        </div>

        <div class="stat-card">
            <div class="stat-number">${responseCount}</div>
            <div class="stat-label">Responses</div>
        </div>

        <div class="stat-card">
            <div class="stat-number">${eventCount}</div>
            <div class="stat-label">Events</div>
        </div>

${invalidTotal > 0 ? invalidSummary : ""}

    </div>
`;



                        jsonBlocks.forEach((jsonText, index) => {

                                const div =
                                        document.createElement("div");

                                div.className = "json-block";

                                try {

                                        const obj =
                                                JSON.parse(jsonText);

                                        const title =
                                                getTitle(obj);

                                        div.classList.add("valid");

                                        let badgeClass =
                                                "event-badge";

                                        let badgeText =
                                                "EVENT";

                                        if (title.startsWith("REQUEST")) {
                                                badgeClass = "request-badge";
                                                badgeText = "REQUEST";
                                        }

                                        if (title.startsWith("RESPONSE")) {
                                                badgeClass = "response-badge";
                                                badgeText = "RESPONSE";
                                        }

                                        const displayTitle = stripTypePrefix(title);

                                        div.innerHTML = `
<details class="json-details">

    <summary>
        <div class="summary-left">
            <span class="badge ${badgeClass}">
                ${badgeText}
            </span>

            <span>${escapeHtml(displayTitle)}</span>
        </div>
    </summary>

<button
    class="copy-btn floating-copy"
    onclick="copyJson(${index}, this)">
    Copy
</button>

    <pre id="json-${index}">
${escapeHtml(JSON.stringify(obj, null, 2))}
    </pre>

</details>
            `;

                                } catch (err) {

                                        div.classList.add("invalid");

                                        const title = getTitleFromRawJson(jsonText);

                                        let badgeClass = "event-badge";
                                        let badgeText = "EVENT";

                                        if (title.startsWith("REQUEST")) {
                                                badgeClass = "request-badge";
                                                badgeText = "REQUEST";
                                        }

                                        if (title.startsWith("RESPONSE")) {
                                                badgeClass = "response-badge";
                                                badgeText = "RESPONSE";
                                        }

                                        const displayTitle = stripTypePrefix(title);

                                        div.innerHTML = `
<details>

    <summary>

        <div class="summary-left">

            <span class="badge ${badgeClass}">
                ${badgeText}
            </span>

            <span>${escapeHtml(displayTitle)}</span>

        </div>

    </summary>

    <pre>${escapeHtml(jsonText.substring(0, 5000))}</pre>

</details>
`;
                                }

                                container.appendChild(div);
                        });
                }

                function getTitleFromRawJson(text) {

                        // REQUEST
                        if (text.includes('"request"')) {

                                const type =
                                        text.match(/"type"\s*:\s*"([^"]+)"/)?.[1] ||
                                        text.match(/"txn_type"\s*:\s*"([^"]+)"/)?.[1] ||
                                        "UNKNOWN";

                                return `REQUEST - ${type}`;
                        }

                        // RESPONSE
                        if (text.includes('"response"')) {

                                const type =
                                        text.match(/"type"\s*:\s*"([^"]+)"/)?.[1] ||
                                        text.match(/"txn_type"\s*:\s*"([^"]+)"/)?.[1] ||
                                        "UNKNOWN";

                                return `RESPONSE - ${type}`;
                        }

                        // EVENT
                        if (text.includes('"event"')) {

                                const type =
                                        text.match(/"type"\s*:\s*"([^"]+)"/)?.[1] ||
                                        text.match(/"txn_type"\s*:\s*"([^"]+)"/)?.[1];

                                const eventType =
                                        text.match(/"event_type"\s*:\s*"([^"]+)"/)?.[1];

                                const receiptOwner =
                                        text.match(/"receipt_owner"\s*:\s*"([^"]+)"/)?.[1];

                                const screenName =
                                        text.match(/"screen_info"\s*:\s*\{[\s\S]*?"name"\s*:\s*"([^"]+)"/)?.[1];

                                const screenTextMatch = text.match(/"screen_info"\s*:\s*\{[\s\S]*?"text"\s*:\s*\[([\s\S]*?)\]/)?.[1];
                                const screenText = screenTextMatch ? screenTextMatch.match(/"([^"]+)"/g)?.map(value => value.replace(/^"|"$/g, '')).filter(Boolean).join(' ') : '';

                                if (eventType === "print_status" && receiptOwner) {
                                        return `EVENT - ${eventType} - ${receiptOwner}`;
                                }

                                // screen_info special handling
                                if (eventType === "screen_info") {
                                        const label = screenName || 'screen_info';

                                        if (screenText) {
                                                return `EVENT - ${eventType} - ${label} - [${screenText}]`;
                                        }

                                        if (type) {
                                                return `EVENT - ${type} - ${eventType} - ${label}`;
                                        }

                                        return `EVENT - ${eventType} - ${label}`;
                                }

                                if (type && eventType) {
                                        return `EVENT - ${type} - ${eventType}`;
                                }

                                if (type) {
                                        return `EVENT - ${type}`;
                                }

                                if (eventType) {
                                        return `EVENT - ${eventType}`;
                                }

                                return "EVENT - UNKNOWN";
                        }

                        return "INVALID JSON";
                }

                function extractMetadata(raw) {

                        const type =
                                raw.includes('"request"') ? 'REQUEST' :
                                        raw.includes('"response"') ? 'RESPONSE' :
                                                raw.includes('"event"') ? 'EVENT' :
                                                        'UNKNOWN';

                        const flowId =
                                raw.match(/"flow_id":"([^"]+)"/)?.[1] || '-';

                        const endpoint =
                                raw.match(/"endpoint":"([^"]+)"/)?.[1] || '-';

                        const eventType =
                                raw.match(/"event_type":"([^"]+)"/)?.[1] || '-';

                        const txnType =
                                raw.match(/"txn_type":"([^"]+)"/)?.[1] || '-';

                        return {
                                type,
                                flowId,
                                endpoint,
                                eventType,
                                txnType
                        };
                }

                function copyJson(index, button) {

                        const text =
                                document.getElementById(
                                        "json-" + index
                                ).innerText;

                        navigator.clipboard.writeText(text)
                                .then(() => {

                                        const originalText = button.innerText;

                                        button.innerText = "✓ Copied!";
                                        button.style.background = "#16a34a";

                                        showToast("JSON copied to clipboard");

                                        setTimeout(() => {
                                                button.innerText = originalText;
                                                button.style.background = "#334155";
                                        }, 1500);

                                })
                                .catch(() => {

                                        button.innerText = "Failed";
                                        button.style.background = "#dc2626";

                                        setTimeout(() => {
                                                button.innerText = "Copy";
                                                button.style.background = "#334155";
                                        }, 1500);

                                });
                }

                function showToast(message) {

                        const toast =
                                document.getElementById("toast");

                        toast.innerText = message;
                        toast.classList.add("show");

                        setTimeout(() => {
                                toast.classList.remove("show");
                        }, 2000);
                }


        </script>

        <div id="toast" class="toast">
                JSON copied to clipboard
        </div>
