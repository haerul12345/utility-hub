<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track 2 Generator</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧰</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #070b14;
            --panel: #0d1321;
            --panel2: #121a2c;
            --accent: #00d4ff;
            --success: #28ff88;
            --warning: #ffb020;
            --danger: #ff5f56;
            --text: #e8eef9;
            --muted: #7d8ca5;
            --border: rgba(0, 212, 255, .26);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            min-height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            background-image:
                linear-gradient(rgba(0, 212, 255, .075) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 212, 255, .075) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .header {
            height: 80px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 0 30px;
            border-bottom: 1px solid var(--border);
            background: rgba(7, 11, 20, .85);
            backdrop-filter: blur(10px);
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            justify-self: start;
            gap: 8px;
            background: none;
            border: none;
            padding: 0;
            min-width: 0;
            height: auto;
            color: var(--accent);
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .back-button:hover {
            background: none;
            opacity: 0.8;
            transform: translateX(-3px);
        }

        .back-button svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .brand {
            grid-column: 2;
            text-align: center;
        }

        .brand h1 {
            color: var(--accent);
            font-size: 28px;
            letter-spacing: 3px;
        }

        .brand p,
        .header-right p,
        .muted {
            color: var(--muted);
            font-size: 12px;
        }

        .header-right {
            justify-self: end;
            text-align: right;
        }

        .header-right .status {
            color: var(--success);
            margin-bottom: 4px;
            letter-spacing: 2px;
        }

        .container {
            max-width: 1500px;
            margin: auto;
            padding: 25px;
        }

        .tool-layout {
            display: grid;
            grid-template-columns: 1.2fr .9fr;
            gap: 20px;
        }

        @media (max-width: 980px) {
            .tool-layout {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 650px) {
            .header {
                grid-template-columns: auto 1fr auto;
                gap: 10px;
                padding: 0 14px;
            }

            .brand h1 {
                font-size: 18px;
                letter-spacing: 2px;
            }

            .brand p,
            .header-right p {
                font-size: 9px;
            }

            .back-button {
                font-size: 12px;
            }

            .container {
                padding: 16px;
            }
        }

        .module {
            background: rgba(8, 14, 26, 0.9);
            border: 1px solid var(--border);
            padding: 18px 18px 14px;
            position: relative;
            min-height: 0;
            box-shadow: inset 0 0 0 1px rgba(0, 212, 255, 0.05);
        }

        .module::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
        }

        .section-title {
            color: var(--accent);
            margin-bottom: 18px;
            letter-spacing: 2px;
            font-size: 16px;
            font-weight: 700;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 18px;
        }

        @media (max-width: 800px) {
            .form-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            color: var(--accent);
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        input {
            width: 100%;
            padding: 10px 10px 9px;
            background: #08101d;
            color: var(--text);
            border: 1px solid var(--border);
            font-family: inherit;
            font-size: 16px;
            height: 36px;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 10px rgba(0, 212, 255, .2);
        }

        .actions {
            margin-top: 8px;
        }

        .hub-btn {
            background: #08101d;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 10px 18px;
            cursor: pointer;
            font-family: inherit;
            transition: .25s;
            font-size: 15px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .hub-btn:hover {
            background: rgba(0, 212, 255, .08);
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 18px 0;
        }

        .chip {
            display: inline-block;
            padding: 2px 7px;
            border: 1px solid var(--accent);
            color: var(--accent);
            font-size: 11px;
            margin-bottom: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .terminal {
            background: rgba(5, 7, 13, 0.92);
            border: 1px solid var(--border);
            box-shadow: inset 0 0 18px rgba(0, 212, 255, 0.04);
            overflow: hidden;
            color: var(--text);
            min-height: 0;
        }

        .output-body {
            display: flex;
            flex-direction: column;
        }

        .output-item {
            padding: 12px 14px 14px;
            border-bottom: 1px solid var(--border);
            background: rgba(12, 17, 29, 0.55);
        }

        .output-item:last-child {
            border-bottom: none;
        }

        .output-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
        }

        .terminal-label {
            color: var(--accent);
            font-size: 13px;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 700;
        }

        .copy-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--accent);
            cursor: pointer;
            transition: .2s ease;
            padding: 0;
            flex-shrink: 0;
        }

        .copy-btn:hover {
            border-color: var(--accent);
            background: rgba(0, 212, 255, 0.06);
        }

        .copy-btn svg {
            width: 13px;
            height: 13px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
        }

        .output-value {
            color: var(--text);
            font-size: 18px;
            line-height: 1.5;
            word-break: break-all;
            font-weight: 500;
        }

        .output-value.track2 {
            font-size: 16px;
        }

        .output-value.status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 18px;
        }

        .ok {
            color: var(--success);
        }

        .warning {
            color: var(--warning);
        }

        .placeholder {
            color: var(--muted);
            font-size: 14px;
            letter-spacing: 1px;
            padding: 18px;
        }

        .passcode-gate {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: grid;
            place-items: center;
            padding: 24px;
            background: rgba(7, 11, 20, .97);
            backdrop-filter: blur(10px);
        }

        .passcode-panel {
            width: min(100%, 420px);
            padding: 32px;
            border: 1px solid var(--border);
            background: var(--panel);
            box-shadow: 0 0 40px rgba(0, 212, 255, .12);
        }

        .passcode-panel h2 {
            margin-bottom: 10px;
            color: var(--accent);
            font-size: 20px;
        }

        .passcode-panel p {
            margin-bottom: 22px;
            color: var(--muted);
            font-size: 13px;
            line-height: 1.6;
        }

        .passcode-panel input,
        .passcode-panel button {
            width: 100%;
            min-height: 46px;
            font: inherit;
        }

        .passcode-panel input {
            margin-bottom: 12px;
            border: 1px solid var(--border);
            padding: 10px 12px;
            background: rgba(7, 11, 20, .9);
            color: var(--text);
        }

        .passcode-panel button:disabled {
            cursor: wait;
            opacity: .65;
        }

        .passcode-error {
            min-height: 20px;
            margin: 12px 0 0 !important;
            color: var(--danger) !important;
        }

        @media (max-width: 480px) {
            .passcode-panel {
                padding: 24px;
            }
        }
    </style>
</head>

<body>
    <div id="passcode-gate" class="passcode-gate">
        <form id="passcode-form" class="passcode-panel" aria-labelledby="passcode-title">
            <h2 id="passcode-title">Track 2 Generator</h2>
            <p>Enter the passcode to continue.</p>
            <input id="passcode-input" type="password" autocomplete="current-password" aria-label="Passcode" required>
            <button id="passcode-submit" type="submit">Unlock utility</button>
            <p id="passcode-error" class="passcode-error" role="alert" aria-live="polite"></p>
        </form>
    </div>

    <header class="header" inert aria-hidden="true">
        <button class="back-button" onclick="history.back()" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 12H5" />
                <path d="M12 19L5 12L12 5" />
            </svg>
            <span>Back</span>
        </button>

        <div class="brand">
            <h1>TRACK 2 GENERATOR</h1>
            <p>dummy magstripe payload builder</p>
        </div>

        <div class="header-right">
            <p>Version 1.0 © 2026 hji</p>
        </div>
    </header>

    <div class="container" inert aria-hidden="true">
        <main class="tool-layout">
            <section class="module">
                <div class="section-title">INPUTS</div>

                <div class="form-grid">
                    <div class="field">
                        <label for="bin">BIN</label>
                        <input type="text" id="bin" maxlength="9" placeholder="5416743" value="5416743">
                    </div>

                    <div class="field">
                        <label for="panLength">PAN LENGTH</label>
                        <input type="number" id="panLength" value="16" min="16" max="19">
                    </div>

                    <div class="field">
                        <label for="expiry">EXPIRY (YY/MM)</label>
                        <input type="text" id="expiry" value="30/12" maxlength="5" placeholder="30/12"
                            inputmode="numeric" autocomplete="off">
                    </div>
                </div>

                <div class="actions">
                    <button class="hub-btn" type="button" onclick="generate()">GENERATE</button>
                </div>

                <div class="divider"></div>

                <div class="chip">FORMAT</div>
                <p class="muted">Creates dummy Track 1 and Track 2 strings with a valid Luhn checksum, editable expiry, and fixed sample cardholder name.</p>
            </section>

            <section class="module">
                <div class="section-title">OUTPUT</div>
                <div id="output" class="terminal">
                    <div class="output-body">
                        <div class="placeholder">Waiting for input...</div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        function calculateLuhnCheckDigit(number) {
            let sum = 0;
            let alternate = true;

            for (let i = number.length - 1; i >= 0; i--) {
                let digit = parseInt(number.charAt(i), 10);

                if (alternate) {
                    digit *= 2;
                    if (digit > 9) {
                        digit -= 9;
                    }
                }

                sum += digit;
                alternate = !alternate;
            }

            return (10 - (sum % 10)) % 10;
        }

        function validateLuhn(cardNumber) {
            let sum = 0;
            let isSecond = false;

            for (let i = cardNumber.length - 1; i >= 0; i--) {
                let digit = parseInt(cardNumber[i], 10);

                if (isSecond) {
                    digit *= 2;
                    if (digit > 9) {
                        digit -= 9;
                    }
                }

                sum += digit;
                isSecond = !isSecond;
            }

            return sum % 10 === 0;
        }

        function copyToClipboard(text) {
            const fallback = () => {
                const temp = document.createElement('textarea');
                temp.value = text;
                temp.setAttribute('readonly', '');
                temp.style.position = 'fixed';
                temp.style.opacity = '0';
                document.body.appendChild(temp);
                temp.select();
                document.execCommand('copy');
                document.body.removeChild(temp);
            };

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).catch(fallback);
                return;
            }

            fallback();
        }

        function renderOutput(pan, track1, track2, isValid) {
            const output = document.getElementById('output');
            const checkMarkup = isValid ? '<span class="ok">YES</span> <span class="ok">✓</span>' : '<span class="warning">NO</span> <span class="warning">✕</span>';

            output.innerHTML = `
                <div class="output-body">
                    <div class="output-item">
                        <div class="output-meta">
                            <div class="terminal-label">PAN</div>
                            <button class="copy-btn" type="button" data-copy="${pan}" aria-label="Copy PAN">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 9.75A2.75 2.75 0 0 1 11.75 7h6.5A2.75 2.75 0 0 1 21 9.75v6.5A2.75 2.75 0 0 1 18.25 19h-6.5A2.75 2.75 0 0 1 9 16.25v-6.5ZM5 14.25A2.75 2.75 0 0 1 7.75 11.5h.75v6.5A3.75 3.75 0 0 0 12.25 22h6.5A2.75 2.75 0 0 1 16 24.75v-.75h-6.5A3.75 3.75 0 0 1 5.75 20.25v-6Z"/></svg>
                            </button>
                        </div>
                        <div class="output-value">${pan}</div>
                    </div>

                    <div class="output-item">
                        <div class="output-meta">
                            <div class="terminal-label">PAN Length</div>
                        </div>
                        <div class="output-value">${pan.length}</div>
                    </div>

                    <div class="output-item">
                        <div class="output-meta">
                            <div class="terminal-label">Luhn Valid</div>
                        </div>
                        <div class="output-value status">${checkMarkup}</div>
                    </div>

                    <div class="output-item">
                        <div class="output-meta">
                            <div class="terminal-label">Track 1 · INGENICO/TEST</div>
                            <button class="copy-btn" type="button" data-copy="${track1}" aria-label="Copy Track 1">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 9.75A2.75 2.75 0 0 1 11.75 7h6.5A2.75 2.75 0 0 1 21 9.75v6.5A2.75 2.75 0 0 1 18.25 19h-6.5A2.75 2.75 0 0 1 9 16.25v-6.5ZM5 14.25A2.75 2.75 0 0 1 7.75 11.5h.75v6.5A3.75 3.75 0 0 0 12.25 22h6.5A2.75 2.75 0 0 1 16 24.75v-.75h-6.5A3.75 3.75 0 0 1 5.75 20.25v-6Z"/></svg>
                            </button>
                        </div>
                        <div class="output-value track2">${track1}</div>
                    </div>

                    <div class="output-item">
                        <div class="output-meta">
                            <div class="terminal-label">Track 2</div>
                            <button class="copy-btn" type="button" data-copy="${track2}" aria-label="Copy Track 2">
                                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 9.75A2.75 2.75 0 0 1 11.75 7h6.5A2.75 2.75 0 0 1 21 9.75v6.5A2.75 2.75 0 0 1 18.25 19h-6.5A2.75 2.75 0 0 1 9 16.25v-6.5ZM5 14.25A2.75 2.75 0 0 1 7.75 11.5h.75v6.5A3.75 3.75 0 0 0 12.25 22h6.5A2.75 2.75 0 0 1 16 24.75v-.75h-6.5A3.75 3.75 0 0 1 5.75 20.25v-6Z"/></svg>
                            </button>
                        </div>
                        <div class="output-value track2">${track2}</div>
                    </div>
                </div>
            `;

            output.querySelectorAll('.copy-btn').forEach((button) => {
                button.addEventListener('click', () => {
                    copyToClipboard(button.dataset.copy);
                    const original = button.innerHTML;
                    button.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.2 4.2L19 2.5"/></svg>';
                    window.setTimeout(() => {
                        button.innerHTML = original;
                    }, 900);
                });
            });
        }

        function hexToBuffer(hex) {
            const bytes = new Uint8Array(hex.length / 2);
            for (let index = 0; index < bytes.length; index++) {
                bytes[index] = parseInt(hex.substr(index * 2, 2), 16);
            }
            return bytes.buffer;
        }

        function toHex(buffer) {
            return Array.from(new Uint8Array(buffer), byte => byte.toString(16).padStart(2, '0')).join('');
        }

        function constantTimeEqual(actual, expected) {
            if (actual.length !== expected.length) return false;
            let result = 0;
            for (let index = 0; index < actual.length; index++) {
                result |= actual.charCodeAt(index) ^ expected.charCodeAt(index);
            }
            return result === 0;
        }

        async function pbkdf2Hex(password, saltHex, iterations = 200000, keyLength = 32) {
            const keyMaterial = await crypto.subtle.importKey(
                'raw',
                new TextEncoder().encode(password),
                { name: 'PBKDF2' },
                false,
                ['deriveBits']
            );
            const bits = await crypto.subtle.deriveBits(
                {
                    name: 'PBKDF2',
                    hash: 'SHA-256',
                    salt: hexToBuffer(saltHex),
                    iterations
                },
                keyMaterial,
                keyLength * 8
            );
            return toHex(bits);
        }

        const storedPasscode = {
            iterations: 200000,
            salt: 'e0490b70b8f422056cc53ce6b7670792',
            hash: '11c5ab0ea887313eafcb37005f028830cbc3cfe728c0f46c6473121d203f7798'
        };

        document.getElementById('passcode-form').addEventListener('submit', async event => {
            event.preventDefault();

            const input = document.getElementById('passcode-input');
            const submit = document.getElementById('passcode-submit');
            const error = document.getElementById('passcode-error');
            const passcode = input.value.trim();

            error.textContent = '';
            if (!passcode) {
                error.textContent = 'Please enter passcode.';
                input.focus();
                return;
            }
            if (!window.crypto?.subtle) {
                error.textContent = 'Passcode verification is unavailable in this browser context.';
                return;
            }

            submit.disabled = true;
            try {
                const derived = await pbkdf2Hex(
                    passcode,
                    storedPasscode.salt,
                    storedPasscode.iterations,
                    32
                );
                if (constantTimeEqual(derived, storedPasscode.hash)) {
                    document.getElementById('passcode-gate').remove();
                    document.querySelector('.header').removeAttribute('inert');
                    document.querySelector('.header').removeAttribute('aria-hidden');
                    document.querySelector('.container').removeAttribute('inert');
                    document.querySelector('.container').removeAttribute('aria-hidden');
                    generate();
                    return;
                }

                error.textContent = 'Wrong passcode.';
                input.value = '';
                input.focus();
            } catch (verificationError) {
                console.error('Passcode verification failed:', verificationError);
                error.textContent = 'Could not verify passcode. Please try again.';
                input.focus();
            } finally {
                submit.disabled = false;
            }
        });

        function generate() {
            const bin = document.getElementById('bin').value.trim();
            const panLength = parseInt(document.getElementById('panLength').value, 10);
            const expiryInput = document.getElementById('expiry').value.trim();

            if (!/^\d{6,9}$/.test(bin)) {
                alert('BIN must be 6 to 9 digits.');
                return;
            }

            if (Number.isNaN(panLength) || panLength < bin.length + 2) {
                alert('PAN length is too short for this BIN.');
                return;
            }

            const expiryMatch = expiryInput.match(/^(\d{2})\/(0[1-9]|1[0-2])$/);
            if (!expiryMatch) {
                alert('Expiry must be in YY/MM format with a valid month, for example 30/12.');
                return;
            }

            const middleLength = panLength - bin.length - 1;
            const panWithoutCheckDigit = bin + '0'.repeat(middleLength - 1) + '1';
            const checkDigit = calculateLuhnCheckDigit(panWithoutCheckDigit);
            const pan = panWithoutCheckDigit + checkDigit;
            const expiry = expiryMatch[1] + expiryMatch[2];
            const serviceCode = '101';
            const discretionaryData = '0000000000';
            const track1 = '%B' + pan + '^INGENICO/TEST^' + expiry + serviceCode + discretionaryData + '?';
            const track2 = ';' + pan + '=' + expiry + serviceCode + discretionaryData + '?';
            const isValid = validateLuhn(pan);

            renderOutput(pan, track1, track2, isValid);
        }
    </script>
</body>

</html>
